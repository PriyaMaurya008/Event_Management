{% extends 'base.html' %}
{% block title %}Login | Event Management{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-intro">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Your events are waiting.</h1>
        <p>Login to see what is happening across campus.</p>
    </div>
    <form class="form-card" method="post">
        <div class="section-heading">
            <p class="eyebrow">USER ACCESS</p>
            <h2>Login</h2>
            <p>Access your existing account.</p>
        </div><label>Email Address<input type="email" name="email" required
                autocomplete="email"></label><label>Password<input type="password" name="password" required
                autocomplete="current-password"></label><button class="button primary" type="submit">Login</button>
        <p class="form-foot">Don't have an account? <a href="{{ url_for('register') }}">Sign In</a></p>
    </form>
</section>
{% endblock %}
